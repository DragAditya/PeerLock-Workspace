services:
  - type: web
    name: peerlock-p2p-workspace
    runtime: node
    buildCommand: pnpm install --frozen-lockfile && pnpm build && pnpm drizzle-kit migrate
    startCommand: pnpm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
